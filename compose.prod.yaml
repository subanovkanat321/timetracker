# Демо на сервере рядом с интернет-магазином (репозиторий subanovkanat321/store).
# Порты наружу не открываются: HTTPS и адрес timetracker.<домен> даёт nginx магазина. Он
# находит приложение по имени timetracker в Docker-сети магазина (store_default).
#
#   cd /opt/timetracker
#   echo "DB_PASSWORD=$(openssl rand -hex 24)" > .env && chmod 600 .env   # один раз
#   docker compose -f compose.prod.yaml --env-file .env up -d --build
name: timetracker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: timetracker
      POSTGRES_USER: timetracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker -d timetracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Сервер общий с магазином (2 ГБ): лимиты, чтобы демо не выдавило магазин
    mem_limit: 256m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/timetracker
      DB_USER: timetracker
      DB_PASSWORD: ${DB_PASSWORD}
      APP_DEMO_DATA: "true"
      # Запросы приходят от nginx: схема https и адрес клиента — из X-Forwarded-*
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # Куча — доля от mem_limit контейнера, а не от памяти всего сервера
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    networks:
      default:
      store:
        aliases:
          - timetracker
    # В простое ~270 МБ (куча + метаданные классов + потоки); куча до 60% = ~300 МБ
    mem_limit: 512m

networks:
  # Сеть магазина: в ней nginx магазина видит приложение по имени timetracker
  store:
    external: true
    name: ${STORE_NETWORK:-store_default}

volumes:
  pgdata:
